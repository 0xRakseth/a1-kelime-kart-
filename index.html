<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İngilizce Kelime Kartları</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .stats-container {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .stat-card {
            background: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            cursor: pointer;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            user-select: none;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
        .stat-card.active {
            border-color: #007bff;
            background: #e9f2ff;
        }
        .stat-card .title { font-size: 14px; color: #666; margin-bottom: 5px; }
        .stat-card .count { font-size: 24px; font-weight: bold; color: #007bff; }
        .flashcard-container {
            width: 100%;
            max-width: 500px;
            height: 300px;
            perspective: 1000px;
            cursor: pointer;
            margin-bottom: 30px;
        }
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }
        .flashcard.flipped {
            transform: rotateX(180deg);
        }
        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .front {
            background: white;
            border-bottom: 5px solid #007bff;
        }
        .back {
            background: #007bff;
            color: white;
            transform: rotateX(180deg);
        }
        .word-tr { font-size: 32px; font-weight: bold; }
        .word-en { font-size: 36px; font-weight: bold; margin-bottom: 15px; }
        .word-pron { font-size: 20px; opacity: 0.8; font-style: italic; }
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 600px;
            margin-bottom: 20px;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        button:hover { opacity: 0.8; }
        button:active { transform: scale(0.98); }
        .btn-correct { background-color: #28a745; }
        .btn-incorrect { background-color: #dc3545; }
        .btn-unknown { background-color: #fd7e14; }
        .btn-action { background-color: #6c757d; }
        .btn-reset { background-color: #6c5ce7; }
        .keyboard-hint {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>

    <div class="stats-container">

        <div class="stat-card" id="tab-incorrect" onclick="switchFolder('incorrect')">

    <div class="controls">

        <button class="btn-reset" onclick="resetAllData()">🔄 İlerlemeyi Sıfırla</button>
    </div>

    <div class="flashcard-container" onclick="flipCard()">
        <div class="flashcard" id="card">
            <div class="face front">

            <div class="face back">

    </div>

    <div class="controls">

        <button class="btn-unknown" onclick="moveWord('unknown')">❓ Bilmiyorum (3)</button>
        <button class="btn-action" onclick="nextCard()">⏭️ Sonraki (Sağ Ok)</button>
    </div>

    <div class="keyboard-hint">

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'incorrect') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                } else if (type === 'unknown') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.15);
                }
            } catch(e) { console.log("Ses çalınamadı:", e); }
        }

                // Hafızadan Verileri Yükle (DÜZELTİLMİŞ)
        function loadSavedData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed.main && parsed.correct && parsed.incorrect && parsed.unknown) {
                        // Eğer main boşsa veya kelime yoksa orijinali yükle
                        if (parsed.main.length === 0 && originalWords.length > 0) {
                            parsed.main = JSON.parse(JSON.stringify(originalWords));
                        }
                        folders = parsed;
                        console.log("Kayıtlı veri yüklendi! Ana havuz:", folders.main.length);
                        return;
                    }
                } catch(e) { 
                    console.log("Hata:", e); 
                }
            }
            // İlk açılış veya veri yoksa
            console.log("Yeni veri oluşturuluyor. Kelime sayısı:", originalWords.length);
            folders = {
                main: JSON.parse(JSON.stringify(originalWords)),
                correct: [],
                incorrect: [],
                unknown: []
            };
        }

        // İlerlemeyi Tarayıcı Hafızasına Kaydet
        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(folders));
        }

        function updateStats() {
            document.getElementById('count-main').innerText = folders.main.length;
            document.getElementById('count-correct').innerText = folders.correct.length;
            document.getElementById('count-incorrect').innerText = folders.incorrect.length;
            document.getElementById('count-unknown').innerText = folders.unknown.length;
            saveData(); // İstatistik her değiştiğinde otomatik kaydet
        }

        window.switchFolder = function(folderName) {
            currentFolder = folderName;
            currentIndex = 0;
            document.querySelectorAll('.stat-card').forEach(card => card.classList.remove('active'));
            document.getElementById(`tab-${folderName}`).classList.add('active');
            showCard();
        };

        function showCard() {
            isFlipped = false;
            const card = document.getElementById('card');
            card.style.transition = 'none';
            card.classList.remove('flipped');
            
            const list = folders[currentFolder];
            if (list.length === 0) {
                document.getElementById('card-tr').innerText = "Klasör Boş!";
                document.getElementById('card-en').innerText = "";
                document.getElementById('card-pron').innerText = "";
                return;
            }

            if (currentIndex >= list.length) currentIndex = 0;
            const word = list[currentIndex];
            document.getElementById('card-tr').innerText = word.tr;
            document.getElementById('card-en').innerText = word.en;
            document.getElementById('card-pron').innerText = `[${word.pron}]`;

            setTimeout(() => {
                card.style.transition = 'transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1)';
            }, 50);
        }

        window.flipCard = function() {
            const list = folders[currentFolder];
            if (list.length === 0) return;
            isFlipped = !isFlipped;
            if (isFlipped) {
                document.getElementById('card').classList.add('flipped');
            } else {
                document.getElementById('card').classList.remove('flipped');
            }
        };

        window.nextCard = function() {
            const list = folders[currentFolder];
            if (list.length <= 1) return;
            currentIndex++;
            if (currentIndex >= list.length) currentIndex = 0;
            showCard();
        };

        window.shuffleCurrentFolder = function() {
            let list = folders[currentFolder];
            for (let i = list.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [list[i], list[j]] = [list[j], list[i]];
            }
            currentIndex = 0;
            showCard();
        };

        window.moveWord = function(targetFolder) {
            const list = folders[currentFolder];
            if (list.length === 0) return;

            playSound(targetFolder);

            if (currentFolder === targetFolder) {
                nextCard();
                return;
            }

            const word = list.splice(currentIndex, 1)[0];
            folders[targetFolder].push(word);
            updateStats();
            if (currentIndex >= list.length) currentIndex = 0;
            showCard();
        };

                window.resetAllData = function() {
            if (confirm("Tüm ilerlemeniz sıfırlanacak. Emin misiniz?")) {
                folders = {
                    main: JSON.parse(JSON.stringify(originalWords)),
                    correct: [],
                    incorrect: [],
                    unknown: []
                };
                currentFolder = 'main';
                currentIndex = 0;
                localStorage.setItem(STORAGE_KEY, JSON.stringify(folders)); // Direkt kaydet
                document.querySelectorAll('.stat-card').forEach(card => card.classList.remove('active'));
                document.getElementById('tab-main').classList.add('active');
                updateStats();
                showCard();
            }
        };

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') { e.preventDefault(); flipCard(); }
            else if (e.code === 'ArrowRight') { e.preventDefault(); nextCard(); }
            else if (e.key === '1') moveWord('correct');
            else if (e.key === '2') moveWord('incorrect');
            else if (e.key === '3') moveWord('unknown');
        });

        // Telefonlarda sese izin vermek için ilk tıklamada ses motorunu tetikle
        document.body.addEventListener('click', function init() {
            initAudio();
            document.body.removeEventListener('click', init);
        });

                // Başlangıç Kurulumu
        if (originalWords.length === 0) {
            console.error("Kelime listesi boş!");
        } else {
            console.log("Kelime listesi yüklendi:", originalWords.length);
        }
        loadSavedData();
        updateStats();
        showCard();
